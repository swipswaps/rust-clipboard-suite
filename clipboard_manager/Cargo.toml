[package]
name = "clipboard_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
base64 = "0.22"
sha2 = "0.10"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
